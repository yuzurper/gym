<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gym</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f0f;
      --surface: #1a1a1a;
      --border: #2a2a2a;
      --accent: #c8ff00;
      --accent-bg: #1a1f0a;
      --text: #f0f0f0;
      --muted: #888;
      --dim: #555;
      --green: #44cc88;
      --orange: #ffaa33;
      --red: #ff5566;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 15px;
      line-height: 1.4;
      padding: 16px;
      max-width: 600px;
      margin: 0 auto;
    }
    button { font: inherit; cursor: pointer; }
    input[type=number] { -moz-appearance: textfield; }
    input::-webkit-outer-spin-button,
    input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

    /* Tabs */
    .tabs { display: flex; gap: 6px; margin-bottom: 18px; }
    .tab {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 20px;
      padding: 6px 0;
      font-size: 13px;
      font-weight: 600;
    }
    .tab.active { border-color: var(--accent); color: var(--accent); background: var(--accent-bg); }

    /* Header */
    .label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .title { font-size: 24px; font-weight: 700; color: var(--accent); margin: 2px 0 16px; }
    .section { margin-bottom: 22px; }
    .section > .label { margin-bottom: 8px; }

    /* Cards */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px;
      margin-bottom: 6px;
    }
    .row { display: flex; align-items: center; gap: 12px; }
    .grow { flex: 1; min-width: 0; }
    .name { font-weight: 600; }
    .sub { font-size: 12px; color: var(--muted); }

    /* Weight input */
    .wt {
      display: flex;
      align-items: center;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding-right: 8px;
    }
    .wt:focus-within { border-color: var(--accent); }
    .wt input {
      width: 58px;
      background: none;
      border: none;
      color: var(--text);
      font-size: 17px;
      font-weight: 700;
      padding: 7px 4px 7px 8px;
      text-align: right;
    }
    .wt input:focus { outline: none; }
    .wt input::placeholder { color: var(--dim); font-weight: 500; }
    .wt span { font-size: 11px; color: var(--muted); }

    /* Protein */
    .protein-top { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 8px; }
    .protein-num { font-size: 28px; font-weight: 700; color: var(--green); }
    .protein-num small { font-size: 14px; color: var(--muted); font-weight: 500; }
    .bar { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
    .bar div { height: 100%; background: var(--green); }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
    .chip {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 16px;
      padding: 5px 11px;
      font-size: 13px;
    }
    .chip b { color: var(--green); }
    .chip i { color: var(--orange); font-style: normal; font-size: 12px; }
    .cal-num { font-size: 28px; font-weight: 700; color: var(--orange); }
    .cal-num small { font-size: 14px; color: var(--muted); font-weight: 500; }
    .bar.kcal div { background: var(--orange); }
    .bar.kcal.over div { background: var(--red); }
    .over { color: var(--red); }
    .nutri-row + .nutri-row { margin-top: 12px; }
    .log { margin-top: 12px; border-top: 1px solid var(--border); padding-top: 6px; }
    .log-row { display: flex; align-items: center; gap: 8px; font-size: 13px; padding: 3px 0; }
    .log-row .at { color: var(--dim); width: 58px; flex-shrink: 0; }
    .log-row .what { flex: 1; min-width: 0; }
    .log-row .nums { color: var(--muted); white-space: nowrap; }
    .log-row button { background: none; border: none; color: var(--dim); font-size: 16px; padding: 0 4px; }
    .chip:active { border-color: var(--green); }
    .protein-edit { display: flex; gap: 6px; margin-top: 10px; }
    .protein-edit input {
      flex: 1;
      width: 0;
      min-width: 0;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 15px;
      padding: 7px 10px;
    }
    .protein-edit input:focus { outline: none; border-color: var(--green); }
    .protein-edit button {
      background: var(--green);
      color: #0f0f0f;
      border: none;
      border-radius: 8px;
      padding: 0 14px;
      font-weight: 700;
    }

    /* Week + month headers */
    .pager { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .pager button {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      width: 36px;
      height: 32px;
    }
    .pager .label { color: var(--text); font-size: 13px; }

    .day-row { cursor: pointer; }
    .day-row.today { border-color: var(--accent); }
    .day-date { width: 40px; text-align: center; }
    .day-date b { display: block; font-size: 17px; }
    .day-row.today .day-date b { color: var(--accent); }
    .day-protein { width: 72px; text-align: right; font-size: 13px; font-weight: 700; }
    .day-protein .bar { margin-top: 4px; height: 4px; }
    .hit { color: var(--green); }

    .stats { display: flex; gap: 6px; margin-bottom: 6px; }
    .stat { flex: 1; text-align: center; }
    .stat b { display: block; font-size: 20px; }

    /* Month calendar */
    .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
    .cal .dow { text-align: center; font-size: 10px; color: var(--dim); font-weight: 700; }
    .cal .cell {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 4px 2px;
      text-align: center;
      min-height: 42px;
      cursor: pointer;
    }
    .cal .cell .d { font-size: 10px; color: var(--muted); }
    .cal .cell .g { font-size: 13px; font-weight: 700; }
    .cal .cell .k { font-size: 9px; color: var(--orange); }
    .cal .cell .k.over { color: var(--red); }
    .cal .cell.hit { background: #0e2419; border-color: #1f5a3c; }
    .cal .cell.today { border-color: var(--accent); }
    .cal .blank { visibility: hidden; }

    /* Lift history table */
    .table-wrap { overflow-x: auto; }
    table { border-collapse: collapse; width: 100%; font-size: 13px; }
    th, td { padding: 6px 4px; text-align: right; white-space: nowrap; }
    th { font-size: 10px; color: var(--muted); font-weight: 700; }
    td:first-child, th:first-child { text-align: left; white-space: normal; padding-left: 0; }
    tr + tr td { border-top: 1px solid var(--border); }
    td.empty { color: var(--dim); }
    td.cur { color: var(--accent); font-weight: 700; }

    @media (max-width: 400px) {
      body { padding: 12px; }
      .title { font-size: 21px; }
    }
  </style>
</head>
<body>

<div id="app"></div>

<script>
const APP_VERSION = 31; // bump on every push
const PROTEIN_GOAL = 175;
const CAL_GOAL = 1800; // daily limit, not a minimum
const GOAL_WEIGHT = 160;

// Each lifting day is 3 supersets: exercises 1+2 are A, 3+4 are B, 5+6 are C.
// Each pair works different muscles where the split allows, so one rests
// while the other works. Superset A is 4 sets, B and C are 3: about 13-14
// weekly sets per major muscle (Pelland 2025).
const T = {
  pullup: "Full hang at the bottom, chin over the bar. Under 5 reps? Use the lat pulldown.",
  lateral: "Light weight. Raise to shoulder height, slight bend in elbows.",
  machineRow: "Chest on the pad. Pull elbows back, squeeze shoulder blades.",
  ezCurl: "Elbows pinned to your sides. No swinging.",
  incline: "Bench at about 30 degrees. Press up over your upper chest.",
  rdl: "Push hips back, flat back. Stop at a strong hamstring stretch.",
  legCurl: "Squeeze hard, return slowly.",
  calf: "Full stretch at the bottom, 1 second pause at the top.",
  knee: "Pull-up bar. Knees to chest, no swinging.",
  ohCable: "Rope on a low pulley, face away. Straighten arms overhead, elbows near your head."
};
const SCHEDULE = {
  sunday: { title: "Pull", exercises: [
    { name: "Pull-ups / Chin-ups", sets: 4, reps: "Max", tip: T.pullup },
    { name: "Lateral Raises", sets: 4, reps: 15, tip: T.lateral },
    { name: "Hammer-Grip Machine Row", sets: 3, reps: "8-10", tip: T.machineRow },
    { name: "EZ Bar Curls", sets: 3, reps: "10-12", tip: T.ezCurl },
    { name: "Face Pulls", sets: 3, reps: 15, tip: "Rope at face height. Pull to forehead, elbows high." },
    { name: "Hammer Curls", sets: 3, reps: 12, tip: "Dumbbells, thumbs up the whole time." }
  ]},
  monday: { title: "Push", exercises: [
    { name: "DB Flat Press", sets: 4, reps: "6-8", tip: "Lower to chest level, elbows about 45 degrees from your body." },
    { name: "Lateral Raises", sets: 4, reps: "12-15", tip: T.lateral },
    { name: "Incline DB Press", sets: 3, reps: "8-10", tip: T.incline },
    { name: "Tricep Rope Pushdowns", sets: 3, reps: "10-12", tip: "Elbows pinned. Spread the rope apart at the bottom." },
    { name: "Cable Flyes", sets: 3, reps: "12-15", tip: "Pulleys at chest height. Slight bend in elbows, bring hands together in front." },
    { name: "DB Overhead Tricep Extension", sets: 3, reps: 12, tip: "One dumbbell in both hands overhead. Lower behind your head, elbows forward." }
  ]},
  tuesday: { title: "Legs", exercises: [
    { name: "Leg Press", sets: 4, reps: "6-8", tip: "Heavy. Lower until knees are near 90 degrees. Do not lock knees." },
    { name: "Leg Curls", sets: 4, reps: "10-12", tip: T.legCurl },
    { name: "Dumbbell RDLs", sets: 3, reps: "8-10", tip: T.rdl },
    { name: "Standing Calf Raises", sets: 3, reps: "12-15", tip: T.calf },
    { name: "Goblet Squats", sets: 3, reps: 10, tip: "Hold one dumbbell at your chest. Sit down between your heels." },
    { name: "Hanging Knee Raises", sets: 3, reps: "12-15", tip: T.knee }
  ]},
  wednesday: { title: "Rest", activities: ["Optional: walk, any amount helps", "7-9 hours sleep"] },
  thursday: { title: "Upper", exercises: [
    { name: "Incline DB Press", sets: 4, reps: "8-10", tip: T.incline },
    { name: "Lat Pulldowns", sets: 4, reps: "8-10", tip: "Pull the bar to your upper chest. Lean back a little." },
    { name: "Seated DB Shoulder Press", sets: 3, reps: "8-10", tip: "Bench upright. Press straight overhead." },
    { name: "Hammer-Grip Machine Row", sets: 3, reps: "10-12", tip: T.machineRow },
    { name: "Overhead Cable Tricep Extension", sets: 3, reps: 12, tip: T.ohCable },
    { name: "EZ Bar Curls", sets: 3, reps: 12, tip: T.ezCurl }
  ]},
  friday: { title: "Lower + Core", exercises: [
    { name: "Walking Lunges", sets: 4, reps: "10/leg", tip: "Dumbbells at sides. Long steps, back knee near the floor." },
    { name: "Hanging Knee Raises", sets: 4, reps: "12-15", tip: T.knee },
    { name: "Leg Extensions", sets: 3, reps: "12-15", tip: "1 second squeeze at the top, return slowly." },
    { name: "Leg Curls", sets: 3, reps: 12, tip: T.legCurl },
    { name: "Dumbbell RDLs", sets: 3, reps: 8, tip: T.rdl },
    { name: "Standing Calf Raises", sets: 3, reps: 15, tip: T.calf }
  ]},
  saturday: { title: "Rest", activities: ["Optional: walk, any amount helps", "7-9 hours sleep"] }
};

// Quick-add buttons: g = protein, kcal = calories. Each row shows sorted by name.
const byLabel = (a, b) => a.label.localeCompare(b.label);
const MEALS = [
  { label: "Protein Powder (2 scoops)", g: 50, kcal: 240 },
  { label: "Chicken/Beef (1 cup)", g: 40, kcal: 250 },
  { label: "Protein Seltzer", g: 30, kcal: 130 },
  { label: "Tuna can", g: 25, kcal: 110 },
  { label: "Fairlife milk (1 cup)", g: 13, kcal: 140 },
  { label: "Bagel sandwich (turkey bacon, egg, cheese)", g: 45, kcal: 850 },
  { label: "Cottage cheese (1/2 cup)", g: 13, kcal: 100 },
  { label: "Greek yogurt (0%, 3/4 cup)", g: 16, kcal: 90 }
].sort(byLabel);
// Calorie fillers
const FILLERS = [
  { label: "Bagel", g: 10, kcal: 280 },
  { label: "Rice (1 cup cooked)", g: 4, kcal: 205 },
  { label: "Banana", g: 1, kcal: 105 },
  { label: "Apple", g: 0, kcal: 95 },
  { label: "Sourdough toast (1 slice)", g: 4, kcal: 100 },
  { label: "Egg", g: 6, kcal: 70 },
  { label: "Peanut butter (2 tbsp)", g: 7, kcal: 190 },
  { label: "Cream cheese (2 tbsp)", g: 1, kcal: 50 }
].sort(byLabel);
function chip(m) {
  return `<button class="chip" onclick="addFood(${m.g}, ${m.kcal}, '${esc(m.label).replace(/'/g, "\\'")}')">${m.label} ${m.g ? `<b>+${m.g}g</b> ` : ''}<i>${m.kcal}</i></button>`;
}

const DAYS = ["sunday","monday","tuesday","wednesday","thursday","friday","saturday"];
const DAY_SHORT = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONTHS_FULL = ['January','February','March','April','May','June','July','August','September','October','November','December'];

/* ---------- Storage (this browser only) ---------- */
// gym_weights_v2: { "<week start YYYY-MM-DD>": { "<day>|<exercise>": lbs } }
// gym_protein_v1: { "<YYYY-MM-DD>": grams }
// gym_cal_v1: { "<YYYY-MM-DD>": kcal }
// gym_body_v1: { "<YYYY-MM-DD>": lbs }
// gym_foodlog_v1: { "<YYYY-MM-DD>": [{ label, g, kcal, at }] }
const WEIGHTS_KEY = 'gym_weights_v2';
const PROTEIN_KEY = 'gym_protein_v1';
const CAL_KEY = 'gym_cal_v1';
const BODY_KEY = 'gym_body_v1';
const FOODLOG_KEY = 'gym_foodlog_v1';

function load(key) {
  try { return JSON.parse(localStorage.getItem(key)) || {}; }
  catch (e) { return {}; }
}
function save(key, obj) {
  try { localStorage.setItem(key, JSON.stringify(obj)); } catch (e) {}
  queuePush();
}

/* ---------- Backup ---------- */
// Cloud: each change goes to the gym-backup Worker (worker/index.js) after 3s.
// The key comes from the link (#k=...) and is also kept in localStorage.
// File: a JSON copy of every gym_ key, saved or restored by hand.
const BACKUP_URL = 'https://gym-backup.yunz-msps.workers.dev/backup';
const sync = { ready: false, timer: null, failed: false };

// Sync bookkeeping uses the gymsync_ prefix so it is never backed up.
function meta(k, v) {
  try {
    if (v === undefined) return localStorage.getItem('gymsync_' + k);
    localStorage.setItem('gymsync_' + k, v);
  } catch (e) { return null; }
}
function backupKey() {
  const m = location.hash.match(/k=([\w-]+)/);
  if (m) { meta('key', m[1]); return m[1]; }
  return meta('key');
}
function snapshot() {
  const data = {};
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (k.startsWith('gym_')) data[k] = localStorage.getItem(k);
  }
  return { v: 1, savedAt: new Date().toISOString(), data };
}
function hasData(snap) {
  return !!(snap && snap.data && Object.keys(snap.data).some(k => k !== 'gym_pbs_migrated'));
}
function applySnapshot(snap) {
  Object.keys(snap.data).forEach(k => localStorage.setItem(k, snap.data[k]));
}
function queuePush() {
  if (!sync.ready || !backupKey()) return;
  clearTimeout(sync.timer);
  sync.timer = setTimeout(pushBackup, 3000);
}
async function pushBackup() {
  try {
    const res = await fetch(BACKUP_URL, {
      method: 'PUT',
      headers: { 'X-Key': backupKey(), 'Content-Type': 'application/json' },
      body: JSON.stringify(snapshot())
    });
    if (!res.ok) throw new Error(res.status);
    meta('cloud_at', new Date().toISOString());
    sync.failed = false;
  } catch (e) { sync.failed = true; }
  renderFoot();
}
// On open: if this phone has no data, restore from the cloud first.
// Pushes stay off until that check succeeds, so an empty phone never
// overwrites a good backup.
async function initSync() {
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  if (!backupKey()) { sync.ready = true; return; }
  if (!hasData(snapshot())) {
    try {
      const res = await fetch(BACKUP_URL, { headers: { 'X-Key': backupKey() } });
      if (!res.ok) throw new Error(res.status);
      const snap = await res.json();
      if (hasData(snap)) { applySnapshot(snap); render(); }
    } catch (e) { sync.failed = true; renderFoot(); return; }
  }
  sync.ready = true;
  if (hasData(snapshot())) pushBackup();
}
function ago(iso) {
  if (!iso) return 'never';
  const min = Math.round((Date.now() - new Date(iso)) / 60000);
  if (min < 1) return 'just now';
  if (min < 60) return `${min} min ago`;
  if (min < 1440) return `${Math.round(min / 60)} h ago`;
  return `${Math.round(min / 1440)} days ago`;
}
function cloudStatus() {
  if (!backupKey()) return 'Cloud backup off';
  if (sync.failed) return 'Cloud backup failed, will retry';
  return `Backed up ${ago(meta('cloud_at'))}`;
}
async function backupFile() {
  const name = `gym-backup-${ymd(today())}.json`;
  const blob = new Blob([JSON.stringify(snapshot())], { type: 'application/json' });
  try {
    const file = new File([blob], name, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file] });
    } else {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = name;
      a.click();
    }
    meta('file_at', new Date().toISOString());
    render();
  } catch (e) {} // share sheet cancelled
}
function restoreFile(f) {
  if (!f) return;
  f.text().then(t => {
    const snap = JSON.parse(t);
    if (!hasData(snap)) { alert('That file has no gym data.'); return; }
    if (!confirm(`Replace the data on this phone with the backup from ${String(snap.savedAt).slice(0, 10)}?`)) return;
    applySnapshot(snap);
    queuePush();
    render();
  }).catch(() => alert('Could not read that file.'));
}

/* ---------- Dates (local time) ---------- */
function ymd(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
function parseYmd(s) { return new Date(s + 'T00:00:00'); }
function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
function weekStart(d) { const x = new Date(d); x.setHours(0,0,0,0); return addDays(x, -x.getDay()); }
function today() { const d = new Date(); d.setHours(0,0,0,0); return d; }
function short(d) { return `${MONTHS[d.getMonth()]} ${d.getDate()}`; }

/* ---------- Weights ---------- */
function liftKey(day, name) { return day + '|' + name; }
function getWeight(weekKey, key) {
  const w = load(WEIGHTS_KEY)[weekKey];
  return w && w[key] != null ? w[key] : null;
}
function setWeight(weekKey, key, val) {
  const all = load(WEIGHTS_KEY);
  all[weekKey] = all[weekKey] || {};
  if (val == null) delete all[weekKey][key];
  else all[weekKey][key] = val;
  save(WEIGHTS_KEY, all);
}
// Most recent weight logged before the given week.
function lastWeight(weekKey, key) {
  const all = load(WEIGHTS_KEY);
  const weeks = Object.keys(all).filter(w => w < weekKey).sort().reverse();
  for (const w of weeks) if (all[w][key] != null) return all[w][key];
  return null;
}

/* ---------- Protein ---------- */
function getProtein(dateKey) { return load(PROTEIN_KEY)[dateKey] || 0; }
function setProtein(dateKey, g) {
  const all = load(PROTEIN_KEY);
  if (!g) delete all[dateKey]; else all[dateKey] = g;
  save(PROTEIN_KEY, all);
}
function getFoodLog(dateKey) { return load(FOODLOG_KEY)[dateKey] || []; }
function setFoodLog(dateKey, log) {
  const all = load(FOODLOG_KEY);
  if (!log.length) delete all[dateKey]; else all[dateKey] = log;
  save(FOODLOG_KEY, all);
}
function getCal(dateKey) { return load(CAL_KEY)[dateKey] || 0; }
function setCal(dateKey, kcal) {
  const all = load(CAL_KEY);
  if (!kcal) delete all[dateKey]; else all[dateKey] = kcal;
  save(CAL_KEY, all);
}

/* ---------- Body weight ---------- */
function getBody(dateKey) { const v = load(BODY_KEY)[dateKey]; return v != null ? v : null; }
function setBody(dateKey, lbs) {
  const all = load(BODY_KEY);
  if (lbs == null || isNaN(lbs)) delete all[dateKey]; else all[dateKey] = lbs;
  save(BODY_KEY, all);
}
// Average of the weigh-ins in the week that starts on ws, or null.
function weekAvg(ws) {
  const vals = [];
  for (let i = 0; i < 7; i++) { const v = getBody(ymd(addDays(ws, i))); if (v != null) vals.push(v); }
  return vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : null;
}
function fmt1(n) { return (Math.round(n * 10) / 10).toFixed(1); }
function change(n) { return (n > 0 ? '+' : '') + fmt1(n); }

// One-time import of old PBs into the week each was logged.
(function migratePBs() {
  const old = load('gym_pbs_v1');
  if (!Object.keys(old).length || localStorage.getItem('gym_pbs_migrated')) return;
  const all = load(WEIGHTS_KEY);
  Object.entries(old).forEach(([name, pb]) => {
    if (pb.weight == null || !pb.updated) return;
    const wk = ymd(weekStart(parseYmd(pb.updated)));
    DAYS.forEach(day => {
      const ex = SCHEDULE[day].exercises;
      if (ex && ex.some(e => e.name === name)) {
        all[wk] = all[wk] || {};
        if (all[wk][liftKey(day, name)] == null) all[wk][liftKey(day, name)] = pb.weight;
      }
    });
  });
  save(WEIGHTS_KEY, all);
  try { localStorage.setItem('gym_pbs_migrated', '1'); } catch (e) {}
})();

/* ---------- State ---------- */
const state = { view: 'day', date: today(), week: weekStart(today()), month: today() };

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;'); }

function tabs() {
  const t = (id, label) => `<button class="tab ${state.view === id ? 'active' : ''}" onclick="go('${id}')">${label}</button>`;
  return `<div class="tabs">${t('day', 'Today')}${t('week', 'Week')}${t('progress', 'Progress')}</div>`;
}

function proteinBar(g) {
  return `<div class="bar"><div style="width:${Math.min(100, g / PROTEIN_GOAL * 100)}%"></div></div>`;
}
function calBar(k) {
  return `<div class="bar kcal ${k > CAL_GOAL ? 'over' : ''}"><div style="width:${Math.min(100, k / CAL_GOAL * 100)}%"></div></div>`;
}

/* ---------- Day view ---------- */
function renderDay() {
  const d = state.date;
  const dayName = DAYS[d.getDay()];
  const sched = SCHEDULE[dayName];
  const wk = ymd(weekStart(d));
  const dk = ymd(d);
  const isToday = dk === ymd(today());

  let html = `<div class="label">${isToday ? 'Today · ' : ''}${DAY_SHORT[d.getDay()]} ${short(d)}</div>
    <div class="title">${sched.title}</div>`;

  const bw = getBody(dk);
  const avg = weekAvg(weekStart(d));
  const prevAvg = weekAvg(addDays(weekStart(d), -7));
  html += `<div class="section"><div class="card row">
    <div class="grow">
      <div class="name">Morning weight</div>
      <div class="sub">${avg != null ? `Week avg ${fmt1(avg)}${prevAvg != null ? ` (${change(avg - prevAvg)})` : ''} · ${fmt1(Math.max(0, avg - GOAL_WEIGHT))} to ${GOAL_WEIGHT}` : `After the bathroom, before food`}</div>
    </div>
    <label class="wt">
      <input type="number" inputmode="decimal" step="0.1" min="0"
        value="${bw != null ? bw : ''}" placeholder="-"
        onchange="onBody('${dk}', this.value)">
      <span>lb</span>
    </label>
  </div></div>`;

  if (sched.exercises) {
    html += `<div class="section"><div class="label">Lifts · week of ${short(weekStart(d))}</div>
      <div class="sub" style="margin:4px 0 8px">Every set: stop with 1-2 reps left, except the last set of each lift: go to failure. Superset A is 4 sets, B and C are 3.</div>`;
    sched.exercises.forEach((ex, i) => {
      const key = liftKey(dayName, ex.name);
      const cur = getWeight(wk, key);
      const prev = lastWeight(wk, key);
      const pair = 'ABC'[Math.floor(i / 2)] + (i % 2 + 1);
      if (i % 2 === 0) html += `<div class="label" style="margin:${i ? 14 : 4}px 0 6px">Superset ${pair[0]}</div>`;
      html += `<div class="card row">
        <div class="grow">
          <div class="name"><span style="color:var(--accent)">${pair}</span> ${esc(ex.name)}</div>
          <div class="sub">${ex.sets} × ${ex.reps} · ${i % 2 === 0 ? `then ${pair[0]}2 right away` : `rest 60-90s, back to ${pair[0]}1`}${prev != null ? ` · last ${prev}` : ''}</div>
          ${ex.tip ? `<div class="sub" style="color:var(--dim)">${esc(ex.tip)}</div>` : ''}
        </div>
        <label class="wt">
          <input type="number" inputmode="decimal" step="0.5" min="0"
            value="${cur != null ? cur : ''}" placeholder="${prev != null ? prev : '-'}"
            onchange="onWeight('${wk}', '${esc(key).replace(/'/g, "\\'")}', this.value)">
          <span>lb</span>
        </label>
      </div>`;
    });
    html += `<div class="sub" style="margin-top:6px">Do A1, then A2, rest 60-90s, and repeat until all sets are done. Then do B and C the same way. Short on time? Skip C. Hit the top reps on every set = add weight next week.</div></div>`;
  } else {
    html += `<div class="section">${sched.activities.map(a => `<div class="card name">${a}</div>`).join('')}</div>`;
  }

  const g = getProtein(dk);
  const k = getCal(dk);
  html += `<div class="section"><div class="label">Food</div>
    <div class="card">
      <div class="nutri-row">
        <div class="protein-top">
          <div class="protein-num">${g}<small> / ${PROTEIN_GOAL}g protein</small></div>
          <div class="sub">${g >= PROTEIN_GOAL ? '<span class="hit">Goal hit</span>' : `${PROTEIN_GOAL - g}g left`}</div>
        </div>
        ${proteinBar(g)}
      </div>
      <div class="nutri-row">
        <div class="protein-top">
          <div class="cal-num">${k}<small> / ${CAL_GOAL} kcal</small></div>
          <div class="sub">${k > CAL_GOAL ? `<span class="over">${k - CAL_GOAL} over</span>` : `${CAL_GOAL - k} left`}</div>
        </div>
        ${calBar(k)}
      </div>
      ${foodLog(dk, g, k)}
      <div class="chips">
        ${MEALS.map(chip).join('')}
      </div>
      <div class="label" style="margin-top:12px">Fillers</div>
      <div class="chips" style="margin-top:6px">
        ${FILLERS.map(chip).join('')}
      </div>
      <div class="protein-edit">
        <input id="p-add" type="number" inputmode="numeric" placeholder="Protein g">
        <input id="k-add" type="number" inputmode="numeric" placeholder="kcal">
        <button onclick="addFood(Number(document.getElementById('p-add').value) || 0, Number(document.getElementById('k-add').value) || 0)">Add</button>
      </div>
      <div class="sub" style="margin-top:6px">Use - to subtract</div>
    </div>
  </div>`;

  html += `<div class="sub">Daily: 5g creatine · 2 fish oil · 1 vitamin D/K · 7-9 h sleep · walking is optional</div>`;
  return html;
}

// What was eaten on this day, with an x to remove a mistake.
function foodLog(dk, g, k) {
  const log = getFoodLog(dk);
  if (!log.length && !g && !k) return '';
  let rows = log.map((e, i) => `<div class="log-row">
    <span class="at">${e.at}</span>
    <span class="what">${esc(e.label)}</span>
    <span class="nums">${e.g}g · ${e.kcal}</span>
    <button onclick="removeFood(${i})" aria-label="Remove">&times;</button>
  </div>`).join('');
  // Totals logged before the list existed have no items.
  const restG = g - log.reduce((a, e) => a + e.g, 0);
  const restK = k - log.reduce((a, e) => a + e.kcal, 0);
  if (restG > 0 || restK > 0) {
    rows = `<div class="log-row"><span class="at"></span><span class="what sub">Earlier (no details)</span>
      <span class="nums">${Math.max(0, restG)}g · ${Math.max(0, restK)}</span><button style="visibility:hidden">&times;</button></div>` + rows;
  }
  return `<div class="log">${rows}</div>`;
}

/* ---------- Week view ---------- */
function renderWeek() {
  const ws = state.week;
  const tk = ymd(today());
  let html = `<div class="pager">
    <button onclick="shiftWeek(-1)">&#8592;</button>
    <div class="label">${short(ws)} - ${short(addDays(ws, 6))}</div>
    <button onclick="shiftWeek(1)">&#8594;</button>
  </div>`;

  let total = 0, logged = 0, hits = 0, kTotal = 0, kLogged = 0;
  for (let i = 0; i < 7; i++) {
    const d = addDays(ws, i);
    const dk = ymd(d);
    const sched = SCHEDULE[DAYS[i]];
    const g = getProtein(dk);
    const k = getCal(dk);
    if (g) { total += g; logged++; if (g >= PROTEIN_GOAL) hits++; }
    if (k) { kTotal += k; kLogged++; }

    let detail = '';
    if (sched.exercises) {
      const done = sched.exercises.filter(ex => getWeight(ymd(ws), liftKey(DAYS[i], ex.name)) != null).length;
      detail = `${done}/${sched.exercises.length} lifts logged`;
    }

    html += `<div class="card row day-row ${dk === tk ? 'today' : ''}" onclick="openDay('${dk}')">
      <div class="day-date"><div class="sub">${DAY_SHORT[i]}</div><b>${d.getDate()}</b></div>
      <div class="grow">
        <div class="name">${sched.title}</div>
        ${detail ? `<div class="sub">${detail}</div>` : ''}
      </div>
      <div class="day-protein ${g >= PROTEIN_GOAL ? 'hit' : ''}">${g ? g + 'g' : '<span class="sub">-</span>'}${g ? proteinBar(g) : ''}
        ${k ? `<div class="sub ${k > CAL_GOAL ? 'over' : ''}" style="margin-top:4px">${k} kcal</div>` : ''}</div>
    </div>`;
  }

  html += `<div class="stats" style="margin-top:12px">
    <div class="card stat"><b>${logged ? Math.round(total / logged) : '-'}</b><span class="sub">avg g/day</span></div>
    <div class="card stat"><b>${hits}/7</b><span class="sub">days at goal</span></div>
    <div class="card stat"><b>${kLogged ? Math.round(kTotal / kLogged) : '-'}</b><span class="sub">avg kcal/day</span></div>
  </div>`;
  const avg = weekAvg(ws);
  const prevAvg = weekAvg(addDays(ws, -7));
  html += `<div class="stats">
    <div class="card stat"><b>${avg != null ? fmt1(avg) : '-'}</b><span class="sub">avg lb</span></div>
    <div class="card stat"><b>${avg != null && prevAvg != null ? change(avg - prevAvg) : '-'}</b><span class="sub">vs last week</span></div>
  </div>`;
  return html;
}

/* ---------- Progress view ---------- */
function renderProgress() {
  const m = state.month;
  const first = new Date(m.getFullYear(), m.getMonth(), 1);
  const daysIn = new Date(m.getFullYear(), m.getMonth() + 1, 0).getDate();
  const tk = ymd(today());

  let total = 0, logged = 0, hits = 0, kTotal = 0, kLogged = 0;
  let cells = DAY_SHORT.map(s => `<div class="dow">${s[0]}</div>`).join('');
  for (let i = 0; i < first.getDay(); i++) cells += `<div class="blank"></div>`;
  for (let day = 1; day <= daysIn; day++) {
    const d = new Date(m.getFullYear(), m.getMonth(), day);
    const dk = ymd(d);
    const g = getProtein(dk);
    const k = getCal(dk);
    if (g) { total += g; logged++; if (g >= PROTEIN_GOAL) hits++; }
    if (k) { kTotal += k; kLogged++; }
    cells += `<div class="cell ${g >= PROTEIN_GOAL ? 'hit' : ''} ${dk === tk ? 'today' : ''}" onclick="openDay('${dk}')">
      <div class="d">${day}</div><div class="g">${g || ''}</div>
      ${k ? `<div class="k ${k > CAL_GOAL ? 'over' : ''}">${k}</div>` : ''}
    </div>`;
  }

  let html = renderBodyProgress() + `<div class="section">
    <div class="pager">
      <button onclick="shiftMonth(-1)">&#8592;</button>
      <div class="label">Food · ${MONTHS_FULL[m.getMonth()]} ${m.getFullYear()}</div>
      <button onclick="shiftMonth(1)">&#8594;</button>
    </div>
    <div class="stats">
      <div class="card stat"><b>${logged ? Math.round(total / logged) : '-'}</b><span class="sub">avg g/day</span></div>
      <div class="card stat"><b>${hits}/${logged}</b><span class="sub">days at goal</span></div>
      <div class="card stat"><b>${kLogged ? Math.round(kTotal / kLogged) : '-'}</b><span class="sub">avg kcal/day</span></div>
    </div>
    <div class="cal">${cells}</div>
  </div>`;

  // Lift weights for the last 6 weeks
  const weeks = [];
  for (let i = 5; i >= 0; i--) weeks.push(addDays(weekStart(today()), -7 * i));
  const all = load(WEIGHTS_KEY);
  html += `<div class="section"><div class="label">Lifts · last 6 weeks (lb)</div>`;
  DAYS.forEach(day => {
    const sched = SCHEDULE[day];
    if (!sched.exercises) return;
    html += `<div class="card table-wrap"><table>
      <tr><th>${DAY_SHORT[DAYS.indexOf(day)]} · ${sched.title}</th>${weeks.map(w => `<th>${w.getMonth() + 1}/${w.getDate()}</th>`).join('')}</tr>`;
    sched.exercises.forEach((ex, i) => {
      const key = liftKey(day, ex.name);
      html += `<tr><td>${esc(ex.name)}</td>${weeks.map((w, j) => {
        const v = all[ymd(w)] && all[ymd(w)][key];
        return v != null ? `<td class="${j === 5 ? 'cur' : ''}">${v}</td>` : `<td class="empty">-</td>`;
      }).join('')}</tr>`;
    });
    html += `</table></div>`;
  });
  html += `</div>`;

  html += `<div class="section"><div class="label">Backup</div>
    <div class="card">
      <div class="sub">${cloudStatus()}</div>
      <div class="sub">Backup file saved ${ago(meta('file_at'))}</div>
      <div class="protein-edit">
        <button style="flex:1;padding:9px" onclick="backupFile()">Save backup file</button>
        <button style="flex:1;padding:9px" onclick="document.getElementById('restore-file').click()">Restore from file</button>
      </div>
      <input type="file" id="restore-file" accept="application/json,.json" style="display:none" onchange="restoreFile(this.files[0])">
    </div>
  </div>`;
  return html;
}

// Weekly averages for the last 8 weeks, with a pace check toward the goal.
function renderBodyProgress() {
  const weeks = [];
  for (let i = 7; i >= 0; i--) {
    const ws = addDays(weekStart(today()), -7 * i);
    const avg = weekAvg(ws);
    if (avg != null) weeks.push({ ws, avg });
  }
  let html = `<div class="section"><div class="label" style="margin-bottom:8px">Body weight · goal ${GOAL_WEIGHT} lb</div>`;
  if (!weeks.length) {
    return html + `<div class="card sub">Log your morning weight on the Today tab. Weekly averages show here.</div></div>`;
  }

  const all = load(BODY_KEY);
  const firstKey = Object.keys(all).sort()[0];
  const start = weekAvg(weekStart(parseYmd(firstKey)));
  const cur = weeks[weeks.length - 1].avg;
  html += `<div class="stats">
    <div class="card stat"><b>${fmt1(cur)}</b><span class="sub">this week avg</span></div>
    <div class="card stat"><b>${fmt1(Math.max(0, start - cur))}</b><span class="sub">lb lost</span></div>
    <div class="card stat"><b>${fmt1(Math.max(0, cur - GOAL_WEIGHT))}</b><span class="sub">lb to go</span></div>
  </div>`;

  // Pace: compare the latest week to the week 3 weeks before it.
  const latest = weeks[weeks.length - 1];
  const old = weeks.find(w => ymd(w.ws) === ymd(addDays(latest.ws, -21)));
  let pace = 'Pace check needs 4 weeks of weigh-ins.';
  if (cur <= GOAL_WEIGHT) pace = '<span class="hit">Goal reached.</span>';
  else if (old) {
    const rate = (latest.avg - old.avg) / 3;
    if (rate > -0.5) pace = `<span class="over">Slow: ${change(rate)} lb/week. Cut about 150 kcal a day.</span>`;
    else if (rate < -0.01 * latest.avg) pace = `<span class="over">Fast: ${change(rate)} lb/week (over 1% of body weight). Add about 150 kcal a day to keep muscle.</span>`;
    else pace = `<span class="hit">On track: ${change(rate)} lb/week.</span>`;
  }
  html += `<div class="card"><div class="sub">${pace}</div></div>`;

  html += `<div class="card table-wrap"><table><tr><th>Week of</th><th>Avg lb</th><th>Change</th></tr>`;
  weeks.slice().reverse().forEach((w, i, arr) => {
    const prev = arr[i + 1] && ymd(arr[i + 1].ws) === ymd(addDays(w.ws, -7)) ? arr[i + 1].avg : null;
    html += `<tr><td>${short(w.ws)}</td><td class="${i === 0 ? 'cur' : ''}">${fmt1(w.avg)}</td><td>${prev != null ? change(w.avg - prev) : '-'}</td></tr>`;
  });
  html += `</table></div></div>`;
  return html;
}

/* ---------- Actions ---------- */
function render() {
  const body = state.view === 'week' ? renderWeek() : state.view === 'progress' ? renderProgress() : renderDay();
  document.getElementById('app').innerHTML = tabs() + body +
    `<div id="foot" class="sub" style="text-align:center;color:var(--dim);margin-top:24px"></div>`;
  renderFoot();
}
function renderFoot() {
  const el = document.getElementById('foot');
  if (el) el.textContent = `v${APP_VERSION} · ${cloudStatus()}`;
}
function go(view) {
  state.view = view;
  if (view === 'day') state.date = today();
  if (view === 'week') state.week = weekStart(today());
  render();
  window.scrollTo(0, 0);
}
function openDay(dk) { state.view = 'day'; state.date = parseYmd(dk); render(); window.scrollTo(0, 0); }
function shiftWeek(n) { state.week = addDays(state.week, 7 * n); render(); }
function shiftMonth(n) { state.month = new Date(state.month.getFullYear(), state.month.getMonth() + n, 1); render(); }
function onWeight(wk, key, val) {
  val = val.trim();
  setWeight(wk, key, val === '' ? null : Number(val));
}
function onBody(dk, val) {
  val = val.trim();
  setBody(dk, val === '' ? null : Number(val));
  render();
}
function addFood(g, kcal, label) {
  if (!g && !kcal) return;
  const dk = ymd(state.date);
  const now = new Date();
  const at = now.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  setFoodLog(dk, getFoodLog(dk).concat({ label: label || 'Custom', g, kcal, at }));
  setProtein(dk, Math.max(0, getProtein(dk) + g));
  setCal(dk, Math.max(0, getCal(dk) + kcal));
  render();
}
function removeFood(i) {
  const dk = ymd(state.date);
  const log = getFoodLog(dk);
  const e = log.splice(i, 1)[0];
  if (!e) return;
  setFoodLog(dk, log);
  setProtein(dk, Math.max(0, getProtein(dk) - e.g));
  setCal(dk, Math.max(0, getCal(dk) - e.kcal));
  render();
}

// The home screen app has no refresh, and Pages caches for 10 min.
// On open, ask for the page with no cache. If it has a newer APP_VERSION,
// load it from a new ?v= URL so no cache can serve the old copy.
async function checkUpdate() {
  try {
    const res = await fetch(location.pathname + '?nc=' + Date.now(), { cache: 'no-store' });
    const m = (await res.text()).match(/APP_VERSION = (\d+)/);
    const latest = m ? Number(m[1]) : 0;
    if (latest > APP_VERSION && sessionStorage.getItem('gym_update_tried') !== String(latest)) {
      sessionStorage.setItem('gym_update_tried', String(latest));
      location.replace(location.pathname + '?v=' + latest + location.hash);
    }
  } catch (e) {}
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) checkUpdate(); });

render();
initSync();
checkUpdate();
</script>

</body>
</html>
