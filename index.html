<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gym</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f0f;
      --surface: #1a1a1a;
      --border: #2a2a2a;
      --accent: #c8ff00;
      --text: #f0f0f0;
      --muted: #888;
      --red: #ff4444;
      --blue: #4a9eff;
      --green: #44cc88;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 15px;
      line-height: 1.5;
      padding: 16px;
      max-width: 600px;
      margin: 0 auto;
    }

    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 20px;
    }
    .day-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 4px;
    }
    .day-title {
      font-size: 24px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.2;
    }
    .day-title span {
      color: var(--accent);
    }
    .date-box {
      text-align: right;
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }
    .date-box .time {
      font-size: 18px;
      font-weight: 600;
      color: var(--text);
    }

    /* Progression banner */
    .progression {
      background: #1a1f0a;
      border: 1px solid #3a4a10;
      border-left: 3px solid var(--accent);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      color: #c8e855;
      margin-bottom: 20px;
    }
    .progression strong { color: var(--accent); }

    /* Section */
    .section-title {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 10px;
    }

    /* Exercise cards */
    .exercises { margin-bottom: 24px; }
    .exercise-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 13px 15px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .ex-num {
      font-size: 11px;
      font-weight: 700;
      color: var(--accent);
      min-width: 18px;
    }
    .ex-body { flex: 1; }
    .ex-name {
      font-weight: 600;
      font-size: 15px;
    }
    .ex-cue {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
    }
    .ex-meta {
      text-align: right;
      white-space: nowrap;
    }
    .ex-sets {
      font-weight: 700;
      font-size: 15px;
      color: var(--accent);
    }
    .ex-reps {
      font-size: 12px;
      color: var(--muted);
    }

    /* Activity cards (rest/recovery days) */
    .activity-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 13px 15px;
      margin-bottom: 8px;
    }
    .activity-task {
      font-weight: 600;
      font-size: 15px;
    }
    .activity-benefit {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
    }

    /* Nutrition */
    .nutrition { margin-bottom: 24px; }
    .meal-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 13px 15px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .meal-body { flex: 1; }
    .meal-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 2px;
    }
    .meal-desc {
      font-weight: 500;
      font-size: 14px;
    }
    .meal-note {
      font-size: 11px;
      color: #888;
      font-style: italic;
      margin-top: 2px;
    }
    .meal-protein {
      font-size: 15px;
      font-weight: 700;
      color: var(--green);
      white-space: nowrap;
    }


/* Nutrition rules */
    .rules {
      margin-top: 10px;
    }
    .rule {
      display: flex;
      gap: 8px;
      font-size: 12px;
      color: var(--muted);
      padding: 4px 0;
      border-top: 1px solid var(--border);
    }
    .rule:first-child { border-top: none; }
    .rule::before { content: "—"; color: #444; flex-shrink: 0; }

    /* Supplements */
    .supplements { margin-bottom: 24px; }
    .supp-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 13px 15px;
      margin-bottom: 8px;
    }
    .supp-timing {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--blue);
      margin-bottom: 2px;
    }
    .supp-desc {
      font-size: 14px;
      font-weight: 500;
    }

    /* Rest day header */
    .rest-header {
      text-align: center;
      padding: 24px 0 16px;
      color: var(--muted);
      font-size: 13px;
    }
    .rest-header .rest-icon {
      font-size: 40px;
      display: block;
      margin-bottom: 8px;
    }
    .rest-header .rest-text {
      font-size: 15px;
      color: var(--text);
      font-weight: 500;
    }

    /* Water */
    .water-bar {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 15px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
    }
    .water-bar .label { color: var(--muted); }
    .water-bar .val { font-weight: 700; color: var(--blue); font-size: 16px; }

    /* Nav bar */
    .nav {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      align-items: center;
    }
    .nav-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 20px;
      padding: 5px 14px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: 0.05em;
      transition: border-color 0.15s, color 0.15s;
    }
    .nav-btn:hover { border-color: #444; color: var(--text); }
    .nav-btn.active { border-color: var(--accent); color: var(--accent); background: #1a1f0a; }
    .nav-btn.back { border-color: #444; color: var(--text); }

    /* Week overview / timeline */
    .week-grid { display: flex; flex-direction: column; gap: 6px; }
    .week-section-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: #444;
      padding: 8px 2px 2px;
    }
    .week-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 11px 14px;
      cursor: pointer;
      transition: border-color 0.15s;
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }
    .week-card:hover { border-color: #444; }
    .week-card.today { border-color: var(--accent); background: #131a02; }
    .week-card.past { opacity: 0.65; }
    .week-card.past:hover { opacity: 1; }
    .week-card.pre-program { opacity: 0.3; cursor: default; }
    .week-date-col {
      min-width: 52px;
      text-align: center;
      padding-top: 1px;
    }
    .week-date-num {
      font-size: 18px;
      font-weight: 700;
      line-height: 1;
      color: var(--text);
    }
    .week-card.today .week-date-num { color: var(--accent); }
    .week-date-month {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-top: 1px;
    }
    .week-card-body { flex: 1; }
    .week-day-name {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted);
      margin-bottom: 2px;
    }
    .week-card.today .week-day-name { color: var(--accent); }
    .week-workout-title {
      font-weight: 600;
      font-size: 14px;
      margin-bottom: 3px;
    }
    .week-detail {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.5;
    }
    .week-tag {
      display: inline-block;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 2px 7px;
      border-radius: 10px;
      margin-top: 4px;
    }
    .week-tag.workout { background: #1a2a05; color: var(--accent); }
    .week-tag.recovery { background: #0a1a2a; color: var(--blue); }
    .week-tag.rest { background: #0a1a2a; color: var(--blue); }
    .week-tag.history { background: #1a1218; color: #c88; }

    /* History detail view */
    .history-card {
      background: var(--surface);
      border: 1px solid #3a2a2a;
      border-left: 3px solid #c88;
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .history-date { font-size: 11px; color: var(--muted); margin-bottom: 6px; }
    .history-title { font-size: 20px; font-weight: 700; margin-bottom: 10px; }
    .history-summary { font-size: 14px; line-height: 1.6; margin-bottom: 10px; }
    .history-note {
      font-size: 12px;
      color: var(--muted);
      font-style: italic;
      border-top: 1px solid var(--border);
      padding-top: 10px;
    }

    /* Personal Best chip on exercise cards */
    .ex-pb {
      margin-top: 6px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
    }
    .ex-pb-val {
      color: var(--accent);
      font-weight: 700;
      background: #1a1f0a;
      border: 1px solid #3a4a10;
      border-radius: 6px;
      padding: 1px 7px;
    }
    .ex-pb-date { color: var(--muted); }
    .ex-pb-add {
      color: var(--muted);
      border: 1px dashed #3a3a3a;
      border-radius: 6px;
      padding: 1px 7px;
    }
    .ex-pb:hover .ex-pb-add { color: var(--accent); border-color: var(--accent); }

    /* Personal Bests page */
    .pb-intro {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.5;
      margin-bottom: 18px;
    }
    .pb-list { display: flex; flex-direction: column; gap: 8px; }
    .pb-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 13px 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      cursor: pointer;
      transition: border-color 0.15s;
    }
    .pb-card:hover { border-color: #444; }
    .pb-name { font-weight: 600; font-size: 15px; }
    .pb-updated { font-size: 11px; color: var(--muted); margin-top: 3px; }
    .pb-updated.none { opacity: 0.7; }
    .pb-value {
      font-weight: 700;
      font-size: 15px;
      color: var(--accent);
      white-space: nowrap;
      text-align: right;
    }
    .pb-add { color: var(--muted); font-weight: 600; font-size: 13px; }

    /* PB edit modal */
    .pb-modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.72);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 100;
    }
    .pb-modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
      width: 100%;
      max-width: 360px;
    }
    .pb-modal-title { font-size: 17px; font-weight: 700; margin-bottom: 4px; }
    .pb-modal-sub { font-size: 12px; color: var(--muted); margin-bottom: 16px; }
    .pb-modal-fields { display: flex; gap: 10px; margin-bottom: 18px; }
    .pb-modal-fields label {
      flex: 1;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .pb-modal-fields input {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 18px;
      font-weight: 700;
      padding: 10px 6px;
      text-align: center;
      width: 100%;
      -moz-appearance: textfield;
    }
    .pb-modal-fields input::-webkit-outer-spin-button,
    .pb-modal-fields input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    .pb-modal-fields input:focus { outline: none; border-color: var(--accent); }
    .pb-modal-actions { display: flex; gap: 10px; }
    .pb-modal-actions button {
      flex: 1;
      border-radius: 8px;
      padding: 11px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      border: 1px solid var(--border);
    }
    .pb-btn-cancel { background: transparent; color: var(--muted); }
    .pb-btn-save { background: var(--accent); color: #0f0f0f; border-color: var(--accent); }
    .pb-modal-clear { text-align: center; margin-top: 14px; }
    .pb-modal-clear button {
      background: none; border: none; color: var(--red);
      font-size: 12px; cursor: pointer;
    }

    @media (max-width: 400px) {
      .day-title { font-size: 20px; }
      body { padding: 12px; }
    }
  </style>
</head>
<body>

<div id="app"></div>

<div id="pb-modal" class="pb-modal-overlay" style="display:none" onclick="pbModalBackdrop(event)">
  <div class="pb-modal">
    <div class="pb-modal-title" id="pb-modal-name"></div>
    <div class="pb-modal-sub">Log your heaviest set. It carries over each week until you change it.</div>
    <div class="pb-modal-fields">
      <label>Weight (lbs)<input id="pb-weight" type="number" inputmode="decimal" step="0.5" min="0"></label>
      <label>Sets<input id="pb-sets" type="number" inputmode="numeric" step="1" min="0"></label>
      <label>Reps<input id="pb-reps" type="number" inputmode="numeric" step="1" min="0"></label>
    </div>
    <div class="pb-modal-actions">
      <button class="pb-btn-cancel" onclick="closePBEditor()">Cancel</button>
      <button class="pb-btn-save" onclick="savePBFromModal()">Save</button>
    </div>
    <div class="pb-modal-clear"><button onclick="clearPBFromModal()">Clear this PB</button></div>
  </div>
</div>

function loadPBs() {

  catch (e) { return {}; }
}
function savePBs(obj) {
  localStorage.setItem(PB_KEY, JSON.stringify(obj));
}
function getPB(name) { return loadPBs()[name] || null; }
function setPB(name, data) {
  const all = loadPBs();
  all[name] = data;
  savePBs(all);
}
function removePB(name) {
  const all = loadPBs();
  delete all[name];
  savePBs(all);
}

function localDateStr(d) {
  d = d || new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}
function formatPBDate(str) {
  if (!str) return '';
  const d = new Date(str + 'T00:00:00');
  return `${MONTH_SHORT[d.getMonth()]} ${d.getDate()}`;
}

// Unique list of every named exercise across the whole schedule, in order.
function allExercises() {
  const seen = new Set();
  const list = [];
  DAYS.forEach(dn => {
    const day = DATA.schedule[dn];
    if (day && day.exercises) {
      day.exercises.forEach(ex => {
        if (!seen.has(ex.name)) { seen.add(ex.name); list.push(ex.name); }
      });
    }
  });
  return list;
}

function pbSummary(pb) {
  if (!pb) return null;
  const parts = [];
  if (pb.weight != null) parts.push(pb.weight + ' lbs');
  if (pb.sets != null && pb.reps != null) parts.push(pb.sets + '×' + pb.reps);
  else if (pb.reps != null) parts.push(pb.reps + ' reps');
  else if (pb.sets != null) parts.push(pb.sets + ' sets');
  return parts.length ? parts.join(' · ') : null;
}

// Escape a value for safe inclusion inside a single-quoted JS string in an attribute.
function jsStr(s) { return String(s).replace(/\\/g, '\\\\').replace(/'/g, "\\'"); }

function pbChipHtml(name) {
  const pb = getPB(name);
  const str = pbSummary(pb);
  if (str) {
    return `<div class="ex-pb" onclick="openPBEditor('${jsStr(name)}')">
      <span class="ex-pb-val">PB ${str}</span>
      ${pb.updated ? `<span class="ex-pb-date">· ${formatPBDate(pb.updated)}</span>` : ''}
    </div>`;
  }
  return `<div class="ex-pb" onclick="openPBEditor('${jsStr(name)}')">
    <span class="ex-pb-add">+ Log PB</span>
  </div>`;
}

/* ---------- PB edit modal ---------- */
let _editingPB = null;

function openPBEditor(name) {
  _editingPB = name;
  const pb = getPB(name) || {};
  document.getElementById('pb-modal-name').textContent = name;
  document.getElementById('pb-weight').value = pb.weight != null ? pb.weight : '';
  document.getElementById('pb-sets').value = pb.sets != null ? pb.sets : '';
  document.getElementById('pb-reps').value = pb.reps != null ? pb.reps : '';
  document.getElementById('pb-modal').style.display = 'flex';
}
function closePBEditor() {
  document.getElementById('pb-modal').style.display = 'none';
  _editingPB = null;
}
function pbModalBackdrop(e) {
  if (e.target.id === 'pb-modal') closePBEditor();
}
function readNum(id) {
  const v = document.getElementById(id).value.trim();
  return v === '' ? null : Number(v);
}
function savePBFromModal() {
  if (_editingPB == null) return;
  const weight = readNum('pb-weight');
  const sets = readNum('pb-sets');
  const reps = readNum('pb-reps');
  if (weight == null && sets == null && reps == null) { closePBEditor(); return; }
  setPB(_editingPB, { weight, sets, reps, updated: localDateStr() });
  closePBEditor();
  _rerender();
}
function clearPBFromModal() {
  if (_editingPB != null) removePB(_editingPB);
  closePBEditor();
  _rerender();
}

function formatTime(d) {
  let h = d.getHours(), m = d.getMinutes();
  const ampm = h >= 12 ? 'PM' : 'AM';
  h = h % 12 || 12;
  return `${h}:${String(m).padStart(2,'0')} ${ampm}`;
}

function formatDate(d) {
  return d.toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' });
}

function cap(s) {
  return s.charAt(0).toUpperCase() + s.slice(1);
}

function renderWorkout(day, dayData, showClock = true) {
  const isRest = dayData.type === 'rest';
  const isRecovery = dayData.type === 'recovery';
  const isWorkout = dayData.type === 'workout';

  const now = new Date();
  const totalProtein = DATA.nutrition.meals.reduce((s, m) => s + m.protein_g, 0);
  const workoutProtein = DATA.nutrition.meals.find(m => m.label === 'Post-Workout').protein_g;
  const restProtein = totalProtein - workoutProtein;

  let html = '';

  // Header
  html += `<div class="header">
    <div>
      <div class="day-label">${cap(day)}</div>
      <div class="day-title"><span>${dayData.title}</span>${dayData.subtitle ? '<br><small style="font-size:14px;color:#888;font-weight:400">' + dayData.subtitle + '</small>' : ''}</div>
    </div>
    ${showClock ? `<div class="date-box">
      <div class="time">${formatTime(now)}</div>
      <div>${formatDate(now)}</div>
    </div>` : ''}
  </div>`;

  // Progression banner (workout days only)
  if (isWorkout) {
    html += `<div class="progression">
      <strong>Progression:</strong> ${DATA.rule_of_progression}
    </div>`;
  }

  // Workout section
  if (isWorkout) {
    html += `<div class="exercises">
      <div class="section-title">Today's Lifts</div>`;
    dayData.exercises.forEach((ex, i) => {
      html += `<div class="exercise-card">
        <div class="ex-num">${i + 1}</div>
        <div class="ex-body">
          <div class="ex-name">${ex.name}</div>
          <div class="ex-cue">${ex.cue}</div>
          ${pbChipHtml(ex.name)}
        </div>
        <div class="ex-meta">
          <div class="ex-sets">${ex.sets} x ${ex.reps}</div>
          <div class="ex-reps">sets x reps</div>
        </div>
      </div>`;
    });
    html += `</div>`;
  }

  // Recovery / Rest activities
  if (isRecovery || isRest) {
    if (isRest) {
      html += `<div class="rest-header">
        <span class="rest-icon">&#x1F4AA;</span>
        <div class="rest-text">Rest day. Recover hard.</div>
      </div>`;
    }
    html += `<div class="exercises">
      <div class="section-title">${isRest ? 'Priorities' : 'Activities'}</div>`;
    dayData.activities.forEach(act => {
      html += `<div class="activity-card">
        <div class="activity-task">${act.task}</div>
        <div class="activity-benefit">${act.benefit}</div>
      </div>`;
    });
    html += `</div>`;
  }

  // Nutrition
  const showPostWorkout = isWorkout;
  const effectiveProtein = showPostWorkout ? totalProtein : restProtein;

  html += `<div class="nutrition">
    <div class="section-title">Nutrition — 170g Protein Goal</div>`;

  DATA.nutrition.meals.forEach(meal => {
    const skip = !showPostWorkout && meal.label === 'Post-Workout';
    if (skip) return;
    html += `<div class="meal-card">
      <div class="meal-body">
        <div class="meal-label">${meal.label}${meal.time ? ' · ' + meal.time : ''}</div>
        <div class="meal-desc">${meal.description}</div>
        ${meal.note ? `<div class="meal-note">${meal.note}</div>` : ''}
      </div>
      <div class="meal-protein">${meal.protein_g}g</div>
    </div>`;
  });


  if (!showPostWorkout) {
    html += `<div class="rules"><div class="rule">Rest day: white rice removed, Factor carbs halved</div></div>`;
  }

  html += `<div class="rules">`;
  DATA.nutrition.rules.slice(0,1).forEach(r => {
    html += `<div class="rule">${r}</div>`;
  });
  html += `</div></div>`;

  // Water
  html += `<div class="water-bar">
    <span class="label">Daily water target</span>
    <span class="val">4 Liters</span>
  </div>`;

  // Supplements
  html += `<div class="supplements">
    <div class="section-title">Supplements</div>`;
  DATA.supplements.forEach(s => {
    const show = isWorkout || s.timing === 'Evening';
    if (!show) return;
    html += `<div class="supp-card">
      <div class="supp-timing">${s.timing}</div>
      <div class="supp-desc">${s.desc}</div>
    </div>`;
  });
  html += `</div>`;

  return html;
}

function dateKey(d) {
  return d.toISOString().slice(0, 10);
}

function renderWeek(todayDate) {
  const today = new Date(todayDate);
  today.setHours(0,0,0,0);

  // Build 15-day window: 7 past + today + 7 future
  const days = [];
  for (let i = -7; i <= 7; i++) {
    const d = new Date(today);
    d.setDate(today.getDate() + i);
    days.push(d);
  }

  const MONTH_SHORT = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const DAY_NAMES = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

  let html = `<div class="nav">
    <button class="nav-btn back" onclick="showToday()">&#8592; Today</button>
  </div><div class="week-grid">`;

  let lastSection = '';
  days.forEach(d => {
    const key = dateKey(d);
    const isToday = key === dateKey(today);
    const isPast = d < today;
    const isPreProgram = d < PROGRAM_START;
    const dayName = DAYS[d.getDay()];
    const sched = DATA.schedule[dayName];
    const hist = HISTORY[key];

    // Section dividers
    const section = isToday ? 'today' : isPast ? 'past' : 'upcoming';
    if (section !== lastSection) {
      if (section === 'today') html += `<div class="week-section-label">Today</div>`;
      else if (section === 'upcoming') html += `<div class="week-section-label">Upcoming</div>`;
      else if (lastSection === '') html += `<div class="week-section-label">Past</div>`;
      lastSection = section;
    }

    const dateNum = d.getDate();
    const dateMonth = MONTH_SHORT[d.getMonth()];
    const dayLabel = DAY_NAMES[d.getDay()];

    let cardClass = 'week-card';
    let onclick = '';
    let titleHtml = '';
    let detailHtml = '';
    let tagHtml = '';

    if (isPreProgram) {
      cardClass += ' pre-program';
      titleHtml = `<div class="week-workout-title" style="color:var(--muted)">—</div>`;
    } else if (isPast && hist) {
      cardClass += ' past';
      onclick = `onclick="showHistory('${key}')"`;
      titleHtml = `<div class="week-workout-title">${hist.session_type}</div>`;
      detailHtml = `<div class="week-detail">${hist.summary}</div>`;
      tagHtml = `<span class="week-tag history">completed</span>`;
    } else if (isPast && !hist) {
      cardClass += ' past';
      titleHtml = `<div class="week-workout-title">${sched.title}</div>`;
      tagHtml = `<span class="week-tag ${sched.type}">${sched.type === 'rest' ? 'recovery' : sched.type}</span>`;
    } else if (isToday) {
      cardClass += ' today';
      onclick = `onclick="showToday()"`;
      titleHtml = `<div class="week-workout-title">${sched.title}</div>`;
      const exList = sched.exercises ? sched.exercises.map(e => e.name).join(' · ') : sched.activities ? sched.activities.map(a => a.task).join(' · ') : '';
      detailHtml = `<div class="week-detail">${exList}</div>`;
      tagHtml = `<span class="week-tag ${sched.type}">${sched.type === 'rest' ? 'recovery' : sched.type}</span>`;
    } else {
      onclick = `onclick="showDay('${dayName}', '${key}')"`;
      titleHtml = `<div class="week-workout-title">${sched.title}</div>`;
      const exList = sched.exercises ? sched.exercises.map(e => e.name).join(' · ') : sched.activities ? sched.activities.map(a => a.task).join(' · ') : '';
      detailHtml = `<div class="week-detail">${exList}</div>`;
      tagHtml = `<span class="week-tag ${sched.type}">${sched.type === 'rest' ? 'recovery' : sched.type}</span>`;
    }

    html += `<div class="${cardClass}" ${onclick}>
      <div class="week-date-col">
        <div class="week-date-num">${dateNum}</div>
        <div class="week-date-month">${dateMonth}</div>
      </div>
      <div class="week-card-body">
        <div class="week-day-name">${dayLabel}${isToday ? ' — Today' : ''}</div>
        ${titleHtml}
        ${detailHtml}
        ${tagHtml}
      </div>
    </div>`;
  });

  html += `</div>`;
  return html;
}

function renderHistoryView(key) {
  const hist = HISTORY[key];
  const d = new Date(key);
  const DAY_NAMES = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const MONTH = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  let html = `<div class="nav">
    <button class="nav-btn back" onclick="showWeek()">&#8592; Week</button>
    <button class="nav-btn" onclick="showToday()" style="margin-left:auto">Today</button>
  </div>
  <div class="history-card">
    <div class="history-date">${DAY_NAMES[d.getDay()]}, ${MONTH[d.getMonth()]} ${d.getDate()}</div>
    <div class="history-title">${hist.session_type}</div>
    <div class="history-summary">${hist.summary}</div>
    <div class="history-note">${hist.note}</div>
  </div>`;
  return html;
}

function renderDayView(dayName, dateLabel) {
  const dayData = DATA.schedule[dayName];
  const d = new Date(dateLabel);
  const MONTH = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const DAY_NAMES_FULL = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const dateStr = `${DAY_NAMES_FULL[d.getDay()]}, ${MONTH[d.getMonth()]} ${d.getDate()}`;
  let html = `<div class="nav">
    <button class="nav-btn back" onclick="showWeek()">&#8592; Week</button>
    <button class="nav-btn" onclick="showToday()" style="margin-left:auto">Today</button>
  </div>
  <div style="font-size:12px;color:var(--muted);margin-bottom:16px">${dateStr}</div>`;
  html += renderWorkout(dayName, dayData, false);
  return html;
}

function renderPBs() {
  let html = `<div class="nav">
    <button class="nav-btn back" onclick="showToday()">&#8592; Today</button>
    <button class="nav-btn" onclick="showWeek()" style="margin-left:auto">Week</button>
  </div>
  <div class="header">
    <div>
      <div class="day-label">Personal Bests</div>
      <div class="day-title"><span>Heaviest Lifts</span></div>
    </div>
  </div>
  <div class="pb-intro">Tap any lift to log your heaviest set — weight, sets & reps. Each entry sticks and carries over week to week until you update it.</div>
  <div class="pb-list">`;

  allExercises().forEach(name => {
    const pb = getPB(name);
    const str = pbSummary(pb);
    html += `<div class="pb-card" onclick="openPBEditor('${jsStr(name)}')">
      <div class="pb-card-body">
        <div class="pb-name">${name}</div>
        ${str
          ? `<div class="pb-updated">Updated ${formatPBDate(pb.updated)}</div>`
          : `<div class="pb-updated none">Not logged yet</div>`}
      </div>
      <div class="pb-value">${str ? str : '<span class="pb-add">+ Add</span>'}</div>
    </div>`;
  });

  html += `</div>`;
  return html;
}

let _todayDate = new Date();
let _todayName = '';
let _rerender = showToday;

function showToday() {
  _rerender = showToday;
  document.getElementById('app').innerHTML =
    `<div class="nav" style="justify-content:flex-end">
      <button class="nav-btn" onclick="showPBs()">PBs</button>
      <button class="nav-btn" onclick="showWeek()">Week</button>
    </div>` + renderWorkout(_todayName, DATA.schedule[_todayName]);
}

function showWeek() {
  _rerender = showWeek;
  document.getElementById('app').innerHTML = renderWeek(_todayDate);
  // Scroll today into view
  const todayCard = document.querySelector('.week-card.today');
  if (todayCard) todayCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function showDay(dayName, dateLabel) {
  _rerender = () => showDay(dayName, dateLabel);
  document.getElementById('app').innerHTML = renderDayView(dayName, dateLabel);
}

function showHistory(key) {
  _rerender = () => showHistory(key);
  document.getElementById('app').innerHTML = renderHistoryView(key);
}

function showPBs() {
  _rerender = showPBs;
  document.getElementById('app').innerHTML = renderPBs();
}

function init() {
  _todayDate = new Date();
  _todayDate.setHours(0,0,0,0);
  _todayName = DAYS[_todayDate.getDay()];
  showToday();
}

// Refresh time every minute
init();
setInterval(() => {
  const timeEl = document.querySelector('.time');
  if (timeEl) timeEl.textContent = formatTime(new Date());
}, 60000);
</script>

</body>
